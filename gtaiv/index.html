<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GTA IV folder treemap</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #12141a; color: #e8e6e3; font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { padding: 16px 20px 6px; display: flex; justify-content: space-between; gap: 16px; align-items: end; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0 0 2px; font-weight: 600; }
  a { color: #8eb4ff; }
  .sub, .hint { color: #9a968e; font-size: 13px; }
  #crumb { font-size: 13px; color: #c8c4bc; }
  #crumb button { background: none; border: 0; color: #8eb4ff; cursor: pointer; font: inherit; padding: 0; }
  #crumb button:hover { text-decoration: underline; }
  #map { height: 52vh; min-height: 320px; margin: 10px 16px; position: relative; background: #0d0f14; border: 1px solid #2a2e38; }
  #status { margin: 24px 16px; color: #9a968e; }
  .cell { position: absolute; overflow: hidden; border: 1px solid rgba(0,0,0,.55); cursor: pointer; }
  .cell.on { outline: 2px solid #f2efe9; outline-offset: -2px; z-index: 1; }
  .cell .label { position: absolute; left: 7px; top: 5px; right: 6px; font-size: 12.5px; font-weight: 650; letter-spacing: .01em; text-shadow: 0 1px 2px rgba(0,0,0,.85); pointer-events: none; white-space: nowrap; overflow: hidden; }
  .cell .sz { position: absolute; left: 7px; top: 22px; font-size: 11px; color: #f4f1ea; opacity: .9; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.85); }
  #tip { position: fixed; pointer-events: none; background: #1c2030; border: 1px solid #3a4154; padding: 8px 10px; font-size: 12px; display: none; z-index: 5; max-width: 480px; }
  #listwrap { margin: 0 16px 24px; border: 1px solid #2a2e38; background: #0d0f14; }
  .bar { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-bottom: 1px solid #2a2e38; flex-wrap: wrap; }
  .bar strong { font-weight: 600; }
  input[type="search"] { background: #171a22; color: #e8e6e3; border: 1px solid #343846; border-radius: 4px; padding: 6px 8px; min-width: 220px; font: inherit; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 12px; border-bottom: 1px solid #222632; }
  th { color: #9a968e; font-weight: 600; font-size: 12px; cursor: pointer; position: sticky; top: 0; background: #141820; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:hover td { background: #1a1e28; }
  .path { color: #9a968e; }
  #more { display: block; width: 100%; background: #171a22; color: #8eb4ff; border: 0; border-top: 1px solid #2a2e38; padding: 10px; cursor: pointer; font: inherit; }
  #more:hover { background: #1e222c; }
</style>
</head>
<body>
<header>
  <div>
    <h1>GTA IV install</h1>
    <div class="sub" id="blurb">Loading wiztree.csv…</div>
  </div>
  <div id="crumb"></div>
</header>
<div id="map"></div>
<p class="hint" id="foldnote" hidden>Blocks under 15 MB are folded into “(smaller)” so the map stays readable. The list still has every file. Replace <code>wiztree.csv</code> next to this page and reload to update it.</p>
<div id="status"></div>
<div id="listwrap" hidden>
  <div class="bar">
    <strong id="scope">All files</strong>
    <span class="hint" id="count"></span>
    <input id="q" type="search" placeholder="Filter names in this folder" autocomplete="off">
  </div>
  <table>
    <thead>
      <tr>
        <th data-k="name">Name</th>
        <th class="num" data-k="size">Size</th>
        <th data-k="mod">Modified</th>
        <th data-k="path">Folder</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <button id="more" type="button" hidden>Show more</button>
</div>
<div id="tip"></div>
<script>
const CSV_URL = "wiztree.csv";
const MIN = 15 * 1048576;
const palette = ["#3d6cb5","#c47a3a","#2f8f6b","#a34d6e","#6b56b0","#b3544a","#2a8484","#8a7430","#4e7d4a","#7a5a3a","#4d6d92","#8a4e62"];

function fmt(n){
  if (n >= 1073741824) return (n/1073741824).toFixed(2) + " GB";
  if (n >= 1048576) return (n/1048576).toFixed(1) + " MB";
  if (n >= 1024) return (n/1024).toFixed(0) + " KB";
  return n + " B";
}
function parseCsv(text){
  const rows = [];
  let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){
        if (text[i+1] === '"'){ cell += '"'; i++; }
        else q = false;
      } else cell += c;
    } else if (c === '"') q = true;
    else if (c === ","){ row.push(cell); cell = ""; }
    else if (c === "\n"){ row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (c !== "\r") cell += c;
  }
  if (cell.length || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function build(rows){
  let header = -1;
  for (let i = 0; i < Math.min(rows.length, 5); i++){
    if (rows[i][0] === "File Name"){ header = i; break; }
  }
  if (header < 0) throw new Error("No File Name column. This expects a WizTree CSV.");
  const col = Object.fromEntries(rows[header].map((name, i) => [name, i]));
  const paths = rows.slice(header + 1).map(r => r[col["File Name"]] || "").filter(Boolean);
  const root = paths.reduce((a, b) => a.length <= b.length ? a : b).replace(/\\+$/, "");
  const folders = new Map();
  const files = [];
  for (const r of rows.slice(header + 1)){
    const name = (r[col["File Name"]] || "").replace(/\\+$/, "");
    if (!name.startsWith(root)) continue;
    const rel = name.slice(root.length).replace(/^\\+/, "").replace(/\\/g, "/");
    const size = parseInt(r[col.Size] || "0", 10) || 0;
    const nfiles = parseInt(r[col.Files] || "0", 10) || 0;
    const ndirs = parseInt(r[col.Folders] || "0", 10) || 0;
    const modified = (r[col.Modified] || "").slice(0, 16);
    if (nfiles || ndirs || !rel) folders.set(rel, size);
    else {
      const parent = rel.includes("/") ? rel.slice(0, rel.lastIndexOf("/")) : "";
      files.push([rel.slice(parent.length ? parent.length + 1 : 0), size, parent, modified]);
    }
  }
  if (!folders.has("")) folders.set("", files.reduce((s, f) => s + f[1], 0));
  const childDirs = new Map();
  for (const d of folders.keys()){
    if (!d) continue;
    const parent = d.includes("/") ? d.slice(0, d.lastIndexOf("/")) : "";
    if (!childDirs.has(parent)) childDirs.set(parent, []);
    childDirs.get(parent).push(d);
  }
  function node(path, depth){
    const name = path ? path.slice(path.lastIndexOf("/") + 1) : "GTAIV";
    const kids = [];
    for (const c of (childDirs.get(path) || []).sort((a, b) => (folders.get(b) || 0) - (folders.get(a) || 0))){
      if (depth >= 1 && (folders.get(c) || 0) < MIN) continue;
      kids.push(node(c, depth + 1));
    }
    let other = 0;
    for (const f of files){
      if (f[2] !== path) continue;
      if (f[1] >= MIN) kids.push({ name: f[0], value: f[1], path: path ? path + "/" + f[0] : f[0], file: true });
      else other += f[1];
    }
    for (const c of childDirs.get(path) || []){
      if (depth >= 1 && (folders.get(c) || 0) < MIN) other += folders.get(c) || 0;
    }
    if (other >= 4 * 1048576) kids.push({ name: "(smaller)", value: other, path, small: true });
    const out = { name, path, reported: folders.get(path) || 0 };
    if (kids.length) out.children = kids;
    else out.value = folders.get(path) || 1;
    return out;
  }
  return { tree: node("", 0), files, total: folders.get("") || 0 };
}

let DATA, stack, selected = "", selectedSmall = false, sortKey = "size", sortDir = -1, shown = 150;
const map = document.getElementById("map");
const tip = document.getElementById("tip");
const crumb = document.getElementById("crumb");
const rowsEl = document.getElementById("rows");
const q = document.getElementById("q");

function val(n){
  if (n.reported) return n.reported;
  if (n.value != null && !n.children) return n.value;
  return (n.children || []).reduce((s, c) => s + val(c), 0);
}
function layout(items, x, y, w, h){
  const out = [];
  function rec(list, x, y, w, h, horiz){
    if (!list.length) return;
    if (list.length === 1){ out.push({ it: list[0], x, y, w, h }); return; }
    const sum = list.reduce((s, it) => s + it.v, 0) || 1;
    let acc = 0, i = 0;
    for (; i < list.length - 1; i++){ acc += list[i].v; if (acc >= sum / 2){ i++; break; } }
    const a = list.slice(0, i), b = list.slice(i);
    const frac = a.reduce((s, it) => s + it.v, 0) / sum;
    if (horiz){
      const w1 = w * frac;
      rec(a, x, y, w1, h, w1 < h);
      rec(b, x + w1, y, w - w1, h, (w - w1) < h);
    } else {
      const h1 = h * frac;
      rec(a, x, y, w, h1, w >= h1);
      rec(b, x, y + h1, w, h - h1, w >= (h - h1));
    }
  }
  rec(items, x, y, w, h, w >= h);
  return out;
}
function renderMap(){
  map.innerHTML = "";
  const node = stack[stack.length - 1];
  const kids = (node.children || []).map((c, i) => ({ c, v: val(c), i })).sort((a, b) => b.v - a.v);
  const rect = map.getBoundingClientRect();
  layout(kids, 0, 0, rect.width, rect.height).forEach(b => {
    const d = document.createElement("div");
    d.className = "cell";
    const path = b.it.c.path || "";
    const key = (b.it.c.small ? "small:" : "") + path;
    if (key && key === document.body.dataset.sel) d.classList.add("on");
    d.style.left = b.x + "px";
    d.style.top = b.y + "px";
    d.style.width = Math.max(0, b.w - 1) + "px";
    d.style.height = Math.max(0, b.h - 1) + "px";
    d.style.background = palette[(b.it.i + stack.length * 3) % palette.length];
    if (b.w > 86 && b.h > 32){
      const l = document.createElement("div");
      l.className = "label";
      l.textContent = b.it.c.name;
      d.appendChild(l);
    }
    if (b.w > 86 && b.h > 48){
      const s = document.createElement("div");
      s.className = "sz";
      s.textContent = fmt(b.it.v);
      d.appendChild(s);
    }
    d.addEventListener("mousemove", ev => {
      tip.style.display = "block";
      tip.style.left = (ev.clientX + 14) + "px";
      tip.style.top = (ev.clientY + 14) + "px";
      tip.innerHTML = "<b>" + b.it.c.name + "</b><br>" + fmt(b.it.v) + (path ? "<br><span style='color:#9a968e'>" + path + "</span>" : "");
    });
    d.addEventListener("mouseleave", () => tip.style.display = "none");
    d.addEventListener("click", () => {
      tip.style.display = "none";
      selected = path;
      selectedSmall = !!b.it.c.small;
      document.body.dataset.sel = key;
      if (b.it.c.children && b.it.c.children.length) stack.push(b.it.c);
      shown = 150;
      q.value = "";
      render();
    });
    map.appendChild(d);
  });
  crumb.innerHTML = stack.map((n, i) => i === stack.length - 1 ? n.name : `<button type="button" data-i="${i}">${n.name}</button>`).join(" / ");
  crumb.querySelectorAll("button").forEach(btn => btn.onclick = () => {
    stack.length = +btn.dataset.i + 1;
    selected = stack[stack.length - 1].path || "";
    selectedSmall = false;
    document.body.dataset.sel = selected;
    shown = 150;
    render();
  });
}
function match(f){
  const parent = f[2];
  const full = parent ? parent + "/" + f[0] : f[0];
  if (selectedSmall){
    if (selected && !(parent === selected || parent.startsWith(selected + "/"))) return false;
    return f[1] < MIN;
  }
  if (!selected) return true;
  return parent === selected || parent.startsWith(selected + "/") || full === selected;
}
function current(){
  const query = q.value.trim().toLowerCase();
  let list = DATA.files.filter(match);
  if (query) list = list.filter(f => f[0].toLowerCase().includes(query) || f[2].toLowerCase().includes(query));
  list.sort((a, b) => {
    let c = 0;
    if (sortKey === "size") c = a[1] - b[1];
    else if (sortKey === "name") c = a[0].localeCompare(b[0]);
    else if (sortKey === "mod") c = a[3].localeCompare(b[3]);
    else c = a[2].localeCompare(b[2]);
    return c * sortDir;
  });
  return list;
}
function renderList(){
  const list = current();
  document.getElementById("scope").textContent = !selected ? "All files" : (selectedSmall ? "Smaller items in " + (selected || "GTAIV") : selected);
  document.getElementById("count").textContent = list.length.toLocaleString() + " files · " + fmt(list.reduce((s, f) => s + f[1], 0));
  const esc = s => String(s).replace(/[&<>]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch]));
  rowsEl.innerHTML = list.slice(0, shown).map(f => `<tr>
    <td>${esc(f[0])}</td>
    <td class="num">${fmt(f[1])}</td>
    <td>${esc(f[3] || "")}</td>
    <td class="path">${esc(f[2] || "(root)")}</td>
  </tr>`).join("");
  const more = document.getElementById("more");
  if (list.length > shown){
    more.hidden = false;
    more.textContent = "Show more (" + (list.length - shown).toLocaleString() + " left)";
  } else more.hidden = true;
}
function render(){ renderMap(); renderList(); }
document.querySelectorAll("th").forEach(th => th.onclick = () => {
  const k = th.dataset.k;
  if (sortKey === k) sortDir *= -1;
  else { sortKey = k; sortDir = k === "size" ? -1 : 1; }
  renderList();
});
q.addEventListener("input", () => { shown = 150; renderList(); });
document.getElementById("more").onclick = () => { shown += 200; renderList(); };
window.addEventListener("resize", () => { if (DATA) renderMap(); });

fetch(CSV_URL, { cache: "no-store" })
  .then(r => {
    if (!r.ok) throw new Error("Could not load " + CSV_URL + " (" + r.status + ")");
    return r.text();
  })
  .then(text => {
    DATA = build(parseCsv(text));
    stack = [DATA.tree];
    document.getElementById("blurb").textContent = fmt(DATA.total) + " from wiztree.csv. Click a block to filter the file list. Click again, or use the breadcrumb, to move.";
    document.getElementById("foldnote").hidden = false;
    document.getElementById("status").hidden = true;
    document.getElementById("listwrap").hidden = false;
    render();
  })
  .catch(err => {
    document.getElementById("status").textContent = err.message + ". The CSV has to be served next to this page (same folder, named wiztree.csv). Opening the HTML as a file usually blocks the fetch.";
  });
</script>
</body>
</html>
