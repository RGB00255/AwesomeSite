const palette = ["#3d6cb5","#c47a3a","#3f8f6b","#a34d6e","#6d5bb8","#b3544a","#2f8a8a","#8a7a3a","#4e7d4a","#7a5a3a","#5a6e8a","#8a4e6a"];
function fmt(n){
  if (n >= 1024**3) return (n/1024**3).toFixed(2) + " GB";
  if (n >= 1024**2) return (n/1024**2).toFixed(1) + " MB";
  if (n >= 1024) return (n/1024).toFixed(0) + " KB";
  return n + " B";
}
function val(n){
  if (n.value != null && !n.children) return n.value;
  if (n.reported) return n.reported;
  return (n.children||[]).reduce((s,c)=>s+val(c),0);
}
function squarify(items, x, y, w, h){
  // simple slice-and-dice alternating, good enough and stable
  const total = items.reduce((s,it)=>s+it.v,0) || 1;
  const out = [];
  function layout(list, x, y, w, h, horiz){
    if (!list.length) return;
    if (list.length === 1){ out.push({it:list[0], x,y,w,h}); return; }
    let acc = 0, i = 0;
    const half = list.reduce((s,it)=>s+it.v,0) / 2;
    for (; i < list.length-1; i++){ acc += list[i].v; if (acc >= half) { i++; break; } }
    const a = list.slice(0, i), b = list.slice(i);
    const av = a.reduce((s,it)=>s+it.v,0);
    const frac = av / (av + b.reduce((s,it)=>s+it.v,0) || 1);
    if (horiz){
      const w1 = w * frac;
      layout(a, x, y, w1, h, !horiz);
      layout(b, x+w1, y, w-w1, h, !horiz);
    } else {
      const h1 = h * frac;
      layout(a, x, y, w, h1, !horiz);
      layout(b, x, y+h1, w, h-h1, !horiz);
    }
  }
  layout(items, x, y, w, h, w >= h);
  return out;
}

const crumb = document.getElementById("crumb");
